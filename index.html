<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pre-hydration theme init — set <html data-theme> before any style paints
      // so there is never a flash of the wrong theme. Mirrors src/lib/theme.ts.
      (function () {
        try {
          var m = localStorage.getItem('cc-theme') || 'system';
          var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.dataset.theme = dark ? 'dark' : 'light';
          if (localStorage.getItem('cc-ambient') === 'off') el.setAttribute('data-ambient', 'off');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/mindmake-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a100d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mindmake" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Mindmake · Control Center" />
    <meta property="og:description" content="Decisions without admin. An AI operations command centre." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://control-center-mindmaker.vercel.app/" />
    <meta property="og:image" content="https://control-center-mindmaker.vercel.app/mindmake-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mindmake" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://control-center-mindmaker.vercel.app/mindmake-og.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mindmake</title>
    <meta name="description" content="Decisions without admin. An AI operations command centre." />
    <style>
      html, body { background: #0a100d; }
      /* Must match --bg-base in src/index.css exactly. This block paints
         before hydration so the page never flashes; when it disagrees with the
         stylesheet it produces the very flash it exists to prevent, which it
         did: two different off-whites across the inline and app styles on
         every light-mode load. */
      html[data-theme='light'], html[data-theme='light'] body { background: #f2f1ea; }
      /* The gradient must LAND on --bg-base, because the splash now fades
         directly into the app rather than onto a blank screen: any disagreement
         between the two grounds is a visible colour shift at the handoff. This
         once ended on a different cream from the app ground.
         Same class of bug as the body background above, which the comment there
         records being fixed; the splash's own gradient was missed. */
      html[data-theme='light'] #brand-splash { background: radial-gradient(120% 90% at 50% 38%, #fbfaf5 0%, #f2f1ea 62%); }
      html[data-theme='light'] #brand-splash .ring { border-color: rgba(20,18,40,0.08); }
      /* The splash paints before the stylesheet, so the paper-theme Mindmake
         mint is duplicated here and kept in step with --accent by hand. */
      html[data-theme='light'] #brand-splash .particle { background: #2f6f51; box-shadow: 0 0 14px 3px rgba(47,111,81,0.28); }
      html[data-theme='light'] #brand-splash img { filter: drop-shadow(0 10px 22px rgba(10,16,13,0.14)); }
      /* Calm & Anticipatory app entry: the mark breathes while a single particle
         orbits it — the system getting ready *for* you — then the whole splash
         exhales (scales up a touch as it fades) to hand off seamlessly to the
         React content rising in beneath it. No hard cut. */
      #brand-splash {
        position: fixed;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 38%, #18241f 0%, #0a100d 62%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2147483647;
        transition: opacity 360ms cubic-bezier(0.22, 1, 0.36, 1),
                    transform 360ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #brand-splash .orbit {
        position: relative;
        width: 120px;
        height: 120px;
      }
      #brand-splash .ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 1px solid rgba(255,255,255,0.06);
      }
      #brand-splash .carrier {
        position: absolute;
        inset: 0;
        animation: brand-orbit 2.6s linear infinite;
      }
      #brand-splash .particle {
        position: absolute;
        left: 50%;
        top: -2px;
        width: 7px;
        height: 7px;
        margin-left: -3.5px;
        border-radius: 9999px;
        background: #7fe3b4;
        box-shadow: 0 0 14px 3px rgba(127,227,180,0.42), 0 0 22px 6px rgba(62,142,104,0.18);
      }
      #brand-splash img {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 72px;
        height: 64px;
        object-fit: contain;
        filter: drop-shadow(0 10px 22px rgba(0,0,0,0.45));
        animation: brand-breathe 2.6s ease-in-out infinite;
      }
      @keyframes brand-orbit {
        to { transform: rotate(360deg); }
      }
      @keyframes brand-breathe {
        0%, 100% { opacity: 0.92; transform: scale(1); }
        50%      { opacity: 1;    transform: scale(1.035); }
      }
      #brand-splash.fade { opacity: 0; transform: scale(1.06); pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #brand-splash .carrier { animation: none; }
        #brand-splash img { animation: none; }
        #brand-splash.fade { transform: none; }
      }
    </style>
  </head>
  <body class="bg-command-bg text-command-text">
    <div id="brand-splash">
      <div class="orbit">
        <div class="ring"></div>
        <div class="carrier"><span class="particle"></span></div>
        <img src="/mindmake-mark.svg" alt="Mindmake" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide the splash once the app has actually painted something to look at.
      //
      // This used to key off `#root.childElementCount > 0`, which is true the
      // instant React commits ANY node. ToastProvider renders a toast container
      // div outside the routed tree, so that condition went true while PilotGate
      // was still awaiting /api/pilot/checkin and rendering nothing. The splash
      // therefore exhaled into a blank screen on every cold load, and content
      // popped in afterwards with no transition. The single most-seen loading
      // moment in the product was a void.
      //
      // So the app now declares readiness explicitly: PilotGate stamps
      // data-app-ready on <html> once it has resolved, which is the same moment
      // the gate or the dashboard first paints. Splash to content becomes one
      // continuous handoff with no blank frame in between.
      (function () {
        var splash = document.getElementById('brand-splash');
        var el = document.documentElement;
        if (!splash) return;
        var done = false;
        var hide = function () {
          if (done) return;
          done = true;
          splash.classList.add('fade');
          setTimeout(function () { splash.remove(); }, 400);
        };
        if (el.hasAttribute('data-app-ready')) return hide();
        var observer = new MutationObserver(function () {
          if (el.hasAttribute('data-app-ready')) {
            observer.disconnect();
            hide();
          }
        });
        observer.observe(el, { attributes: true, attributeFilter: ['data-app-ready'] });
        // Safety net so a render error, or an unreachable pilot service, never
        // leaves the splash on screen. Unchanged: this is the backstop that
        // makes holding the splash safe in the first place.
        setTimeout(function () { observer.disconnect(); hide(); }, 6000);
      })();
    </script>
  </body>
</html>
