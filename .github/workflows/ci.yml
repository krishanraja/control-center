name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 20, not 18. Node 18 has no `globalThis.crypto`, so src/lib/editLedger.ts
          # `sha256Hex` took its documented null path and the digest assertion in
          # tests/api/editLedger.test.ts failed on the runner and nowhere else.
          # Main was red from 2026-09-19 to 2026-09-20 for that alone. Nothing this
          # repo deploys to runs Node 18: Vercel functions are 20+, and every browser
          # has webcrypto. Testing on 18 was testing an environment nobody has.
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # The api/ tree was never type-checked by CI: `tsc --noEmit` reads the root
      # tsconfig, which only includes src/. tsconfig.api.json existed but was
      # documented as "NOT a CI gate yet" because of a standing error baseline.
      # That baseline hid two routes importing _supabase.js at the wrong depth,
      # both of which returned HTTP 500 on every request in production for as
      # long as they had existed. Baseline is now zero; keep it there.
      - run: npm run typecheck:api
      # scripts/ runs under tsx, so it gets its own config rather than being held
      # to the api tree's NodeNext resolution (which flagged 23 non-bugs).
      - run: npm run typecheck:scripts
      # Every AI surface writes the same small event envelope. Hold that
      # boundary to strict fields, deterministic hashes and secret rejection.
      - run: npm run check:harness-events
      # Remote clients get separate revocable identities and one write-only
      # MCP tool. Hold auth, server-owned attribution, idempotency, redaction
      # and the per-emitter safety limit as executable contracts.
      - run: npm run check:harness-mcp
      # Video Engine commands cross an authenticated cloud-to-runner boundary.
      # Keep fail-closed auth, exact lineage, recovery and media-separation
      # invariants executable on every change rather than relying on review.
      - run: npx tsx scripts/check-goal-ladder.mts
      - run: npx tsx scripts/check-goal-gate.mts
      # The 2026-08-21 sweep put every text size in src/ on the role scale and
      # every uppercase label on the one eyebrow recipe. A single re-introduced
      # text-[13px] is invisible in review; this keeps the scale swept.
      - run: npx tsx scripts/check-type-tokens.mts
      # Same date, same shape, for icons: every glyph ships through the
      # src/lib/icons wrapper (constant 1.75px stroke, snapped sizes), and
      # this keeps direct lucide imports, stray stroke weights, and emoji
      # stand-ins from creeping back.
      - run: npx tsx scripts/check-icons.mts
      - run: npx tsx scripts/check-icon-stroke.mts
      # A timestamp the code has not proved is a timestamp takes the whole tab
      # down: date-fns and Intl both throw RangeError on an invalid date, and
      # the error boundary turns that into "failed to render" where the board
      # should be. 17 unguarded call sites were found on 2026-09-23, two of
      # which crashed their tab against ordinary data.
      - run: npx tsx scripts/check-safe-dates.mts
      # Same reason: 274 of 323 content ideas were unpurgeable because eleven
      # insert paths could each forget an expiry. The invariant now lives in a
      # column default, and this checks the default, the reserved meaning of
      # NULL, and the purge that depends on both.
      # And once more for the other half of the same tab: the decision queue
      # had no week bound at all, so it served the thirty oldest pending cards
      # ever written and the same 10 July brief review sat at slot 1 for six
      # weeks. The window is now defined once per side (the browser cannot
      # import from api/), and this checks the two agree, that the read stays
      # bounded, and that the purge still ages every card kind.
      - run: npx tsx scripts/check-content-window.mts
      # And for the layer that cannot be caught downstream: G6 blocks any draft
      # that does not carry the terminal statement VERBATIM, so a wrong name in
      # it ships under Krish's name. G1 credited every number on a vendor domain
      # to the domain owner, and published Stuut's 81.7% as Andreessen Horowitz's
      # number. This checks a name is printed only where the sentence gives one.
      # C3 of the content rewrite. The acceptance criterion is "100 percent of
      # surfaced cards pass lint, anything below 100 is a bug", which is only
      # worth anything if the lint itself is trustworthy. This runs it against
      # the engine's own 2026-W28..W33 output: all 17 so-whats must be rejected,
      # and a card written to the brief must still pass.
      # Step 2 of the rewrite. The six lenses are declared twice by necessity:
      # the CHECK constraint is what rejects a bad write, the union is what
      # stops the code producing one. Drift between them fails inside a cron in
      # production rather than here. Also holds the two rules an edit is most
      # likely to quietly undo: no catch-all lens, and none of the nine retired
      # areas creeping back in.
      # Steps 4, 5 and 6. Three rules here are the kind an edit undoes as a
      # convenience and nobody notices until the queue is wrong again: a single
      # event must be BLOCKED rather than scored low, independence must be
      # counted by origin rather than story volume, and the two reserved slots
      # must stay empty rather than backfill with the familiar. Also checks that
      # every reader excludes merged arcs, now that a merge keeps the row.
      # Step 7. Krish ranked forty generated ideas lead/yes/maybe/no. The set is
      # useful and it is also the most concentrated statement of interest in the
      # system, so the assertion that matters most here is a negative one: the
      # scorer must not be able to see it. A proposer ranking by what he already
      # approved still returns seven cards a week, so nothing would look broken.
      # Also holds folder coverage, and stops a format being deleted for
      # converting badly rather than marked and kept.

      - name: n8n sync drift guard still blocks destructive pushes
        run: npx tsx scripts/check-n8n-sync-guard.mts
      # The one that would have caught the whole thing. Steps 1 to 7 each passed
      # their own guard while none of it ran: scoreArc, surface and lintCard were
      # called by nothing, every live arc had lens null, and the Content tab was
      # still served by the old decisions path. Every guard was green because each
      # checked a component against its own contract and nothing checked that the
      # components were joined up. This walks the chain link by link.
      # Same reason again: the reject-reason taxonomy lived in three files that
      # disagreed on 26 codes, and 18 codes the UI could emit were missing from
      # the server's allow-list, so a whole class of rejection reached the
      # learning loop with no usable reason on it. This checks the one
      # vocabulary, the one surface set, and that anything you can refuse can
      # also tell you why it was served.
      - run: npx tsx scripts/check-served-surfaces.mts
      # The bridges surface drafts and never sends. "Send to my inbox" makes a
      # Gmail draft addressed to Krish, with the contact's address quoted in the
      # body rather than filled into the To line, so a mis-click in Gmail cannot
      # reach the other person. That rests on what the code can reach, not on
      # anyone remembering the rule, so a send client appearing there fails here.
      - run: npx tsx scripts/check-bridges-never-send.mts
      # And again, for the enrichment path: every provider helper in _enrich.ts
      # returns '' on failure, so a run where PDL was out of credits still wrote
      # enrichment_status='enriched' and — carrying a dossier — became
      # permanently ineligible for retry. "Do not mark a record enriched when a
      # provider was blocked" is a control-flow property, not a type, so it is
      # checked here.
      - run: npx tsx scripts/check-enrichment-honesty.mts
      # The attend lane, same class of defect. Two rules, both of which cost an
      # evening when broken and neither of which is visible on the card: a row
      # with date_verified=false can never be recommended, and a scoring pass with
      # no model available writes nothing rather than a zero (a zero reads as a
      # verdict on the room and is the same pixels as an honest one). The last
      # section runs the arithmetic over the real rooms that were the top of the
      # lane on 2026-09-24, because a shape check cannot tell whether a developer
      # meetup is actually rejected, and that is the whole point of the change.
      - run: npx tsx scripts/check-events-honesty.mts
      # The fleet observer is the one health signal not self-reported by the
      # thing it measures, so its two classifiers decide what anyone believes
      # about a failure. Both are ordering sensitive and both shipped wrong
      # once: a blown plan quota read as a broken credential (n8n wraps nearly
      # every non-2xx in "perhaps check your credentials?"), and a scheduled
      # workflow that never ran read as idle rather than dead.
      - run: npx tsx scripts/check-fleet-classifier.mts
      # Light/dark. A fixed hex paired with an adaptive token is invisible in
      # one of the two themes, and each half looks fine in review: the Home door
      # pills and the critical alert banner shipped dark-on-dark in daylight,
      # and the whole *-300 accent tier measured 1.6-2.0:1 on paper. This checks
      # the property rather than the mechanism, so deliberate fixed mid-tones
      # pass and only genuinely one-sided colours fail.
      - run: npx tsx scripts/check-theme-tokens.mts
      # Control Center and the Video Engine share the Mindmake instrument-room
      # identity. Hold the exact official mark, four type roles, palette anchors
      # and shared chrome so a local purple/fake-logo fork cannot creep back in.
      - run: npx tsx scripts/check-mindmake-design.mts
      - run: npx tsx scripts/check-mindmake-gate.mts
      # Claims, evidence, objections and decisions can change meaning when a
      # clause is clipped. Content and Studio surfaces must wrap the full text
      # or place it behind a deliberate disclosure, never ellipsise it.
      - run: npm run check:editorial-text
      # One neutral source, independent series judgements, one approved child
      # lineage and no second Content UI.
      - run: npm run check:content-spine
      # Every production start must bind one exact approved Content revision;
      # no Video or Carousel Studio route may re-ideate around it.
      # The Content tab says when a cron has gone quiet. It can only say so
      # for crons it knows about, so the schedule table and vercel.json are
      # held to the same set, and every listed job must record its runs.
      # A variable the code reads and .env.example does not name is a feature
      # that can vanish in one environment with nothing in the logs.
      - run: npx tsx scripts/check-env-example.mts
      # Behaviour tests for the pure halves of the content-to-production
      # bridge and the run ledger. The structural guards above assert that
      # lines exist; these assert what the functions do.
      #
      # The two fake credentials are what makes the job honest rather than green.
      # api/_supabase.ts throws at MODULE LOAD when they are absent, so any test
      # file whose import graph reaches it dies before a single assertion runs,
      # and node:test reports that as one failed subtest per file. Two files hit
      # it, apifyCounts and postedAt, and the whole job went red while the rest
      # of the suite passed, which reads like a broken test rather than a missing
      # variable.
      #
      # These values are deliberately not secrets and are never reached: every
      # test here exercises a pure function, and a real request with them would
      # fail. The deeper fix is for that module to throw on first USE rather than
      # on import, which would make every route testable without it; that is a
      # change to every route's module graph and does not belong in this commit.
      - run: npx tsx --test tests/api/*.test.ts
        env:
          SUPABASE_URL: https://ci.invalid
          SUPABASE_SERVICE_ROLE_KEY: not-a-real-key-tests-never-call-out
      # Krish's own builds as Content Engine supply: five named products,
      # everything else anonymous, no figure in a Money of AI candidate, one
      # source type declared in three places, the Saturday cron wired.
      # The AEO read on the Growth tab computes its sentences from rows; this
      # holds them to fixtures so a sentence cannot silently start lying. The
      # engine owns api/aeo/*; this guard reads src/lib/aeo.ts only.
      - run: npm run check:aeo-read
      # Prompt caching fails silently: no error, just a bigger bill. Until
      # 2026-09-09 five call sites plucked input_tokens and output_tokens by
      # hand and dropped the cache fields, so a cached call and an uncached one
      # of the same size were identical in meter_daily. This holds every site
      # to passing its whole usage object, so a sixth site copied from a fifth
      # cannot reintroduce the blind spot. Deterministic and free: it makes no
      # API call, so it runs on every push rather than rarely and late.
      - run: npm run check:cache-metering
      # Ten workflow mirrors carried the live Supabase service-role key in
      # plaintext for months. That key bypasses RLS on every table, including
      # contact_intelligence, which is service-role-only precisely because it
      # holds private judgments about named people. The n8n editor exports
      # credentials inline, so the next export re-adds them unless something
      # fails the build. scripts/n8n/secrets.mjs is the supported path.
      - run: npx tsx scripts/check-no-secrets.mts
      # The usage meter answers "which agent is spending my money" from a stamp
      # passed at each Anthropic call site. A site that forgets it still meters,
      # as "unattributed" — honest, and useless. The failure is silent and
      # arrives by drift: four new callClaude sites landed on main while the
      # meter was being built on a branch, and nothing said so.
      - run: npx tsx scripts/check-agent-stamps.mts
      # api/_prices.ts prices an unknown model at ZERO on purpose, because a
      # guessed rate is worse than a visible gap. That default is right and a
      # terrible thing to discover in production: the meter keeps reporting
      # numbers, they are just all zero for the model nobody added. It nearly
      # happened — a model sweep moved the fleet onto Claude 5 in the same week
      # the meter was built, and every synthesis call would have metered real
      # tokens against $0.00.
      - run: npx tsx scripts/check-model-prices.mts
      # A cross-provider fallback is the one piece of resilience that fails
      # silently by construction: the run stays green, the output just goes
      # empty. Nine of the eleven Gemini branches in scripts/n8n could not have
      # worked — wrong prompt key, unparseable response shape — and no
      # execution list would ever have said so.
      - run: npx tsx scripts/check-anthropic-fallback.mts
      # Model routing is a cost and quality policy, and until 2026-09-24 it was
      # the one policy guard that did not run here. It existed only as the
      # `check:model-routing` npm script, so nothing failed when a route was
      # decided in the repo and never deployed. That is exactly what happened:
      # the 2026-09-12 audit moved the Task Lever Rater to Sonnet 5 at 2k
      # tokens, the mirror was committed, the runtime was not updated, and
      # production kept calling claude-opus-5 at 16k for twelve days with this
      # guard green — because it asserts against the mirror, which was correct.
      # Wiring it in does not close that gap on its own (see
      # check-model-routing-live.mts, which reads the runtime and needs a
      # credential CI does not hold). What it does close is the other half: a
      # cloud export can no longer put a retired model back into a mirror
      # without failing here.
      - run: npx tsx scripts/check-model-routing.mts
      # NOW.md is the one file agents are promised is current, and
      # docs/history/LOG.md is where superseded material goes instead of being
      # deleted. Both have a schema (docs/steward/SCHEMA.md). A branch can
      # break either without any test noticing, so the structural half of the
      # steward's validator runs here; the head/as_of half only holds on main
      # and runs in .github/workflows/docs-steward.yml.
      - run: node scripts/steward/validate.mjs . --fleet docs/steward/fleet.json --repo control-center

  # The Content surface and the Video Engine reviewer, in a real browser
  # against the production build with every network call mocked. These
  # specs existed for months and never ran in CI, so a broken surface
  # shipped green. Placeholder Supabase values are enough: nothing connects.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_UI_V2_ENABLED: 'true'
          VITE_VIDEO_ENGINE_ENABLED: 'true'
      - run: npx playwright test --project=default e2e/content-rooms.spec.ts e2e/content-queue-window.spec.ts e2e/composer.spec.ts e2e/fact-check-strip.spec.ts e2e/video-engine-mobile.spec.ts e2e/growth-scroll.spec.ts e2e/home-noscroll.spec.ts e2e/events-lane.spec.ts --reporter=line
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_UI_V2_ENABLED: 'true'
          VITE_VIDEO_ENGINE_ENABLED: 'true'
      # The desk projects, at 1440 and 1920, holding real data. CI ran one
      # viewport — 1280x800 — while the breakpoint the rails and focus columns
      # hang off is 1400px, so an entire class of layout shipped untested and
      # Krish found four broken surfaces by opening the app. These specs are
      # cheap and they are the ones that would have caught it.
      - run: npx playwright test --project=desk-1440 --project=desk-1920 --reporter=line
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_UI_V2_ENABLED: 'true'
      # The phone, at 390x844 and 360x640. The desk pass of 2026-09-23 fixed
      # fifteen surfaces and never once rendered the shell Krish actually
      # carries. 360x640 is the size that bites: Home clipped its own primary
      # action there, and Visibility's triage card was left 55px of the screen,
      # both while every desk check was green.
      - run: npx playwright test --project=phone-390 --project=phone-360 --reporter=line
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_UI_V2_ENABLED: 'true'
          VITE_VIDEO_ENGINE_ENABLED: 'true'
